document.addEventListener('click',e=>{const tab=e.target.closest('.export-tab');if(tab){document.querySelectorAll('.export-tab').forEach(x=>x.classList.remove('active'));tab.classList.add('active')}const card=e.target.closest('.color-card');if(card){document.querySelectorAll('.color-card').forEach(x=>x.classList.remove('active'));card.classList.add('active');const dot=card.querySelector('.color-dot'),hex=card.querySelector('b')?.textContent;const pin=document.querySelector('.picker-pin'),chip=document.querySelector('.palette-v2 .chip');if(pin&&dot)pin.style.background=getComputedStyle(dot).backgroundColor;if(chip&&hex)chip.textContent='当前 '+hex}const ratio=e.target.closest('.ratio');if(ratio){document.querySelectorAll('.ratio').forEach(x=>x.classList.remove('active'));ratio.classList.add('active')}});
let drag=null;document.addEventListener('pointerdown',e=>{const box=e.target.closest('.crop-selection');if(!box||e.target.classList.contains('handle'))return;const stage=box.parentElement,br=box.getBoundingClientRect(),sr=stage.getBoundingClientRect();drag={box,stage,sr,dx:e.clientX-br.left,dy:e.clientY-br.top};box.setPointerCapture?.(e.pointerId)});document.addEventListener('pointermove',e=>{if(!drag)return;const br=drag.box.getBoundingClientRect();let x=Math.max(0,Math.min(e.clientX-drag.sr.left-drag.dx,drag.sr.width-br.width));let y=Math.max(0,Math.min(e.clientY-drag.sr.top-drag.dy,drag.sr.height-br.height));drag.box.style.left=(x/drag.sr.width*100)+'%';drag.box.style.top=(y/drag.sr.height*100)+'%'});document.addEventListener('pointerup',()=>drag=null);
</script></body></html>
