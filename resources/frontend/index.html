<!DOCTYPE html>
<html lang="zh-CN" class="studio-theme-dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lavans — AI Creative Canvas</title>
<link rel="stylesheet" href="theme.css">
<script src="brand-config.js"></script>
<style>
:root {
    --accent: #000000;
    --fluid-ease: cubic-bezier(0.3, 0, 0, 1);
    --bg: #ffffff;
    --sidebar-bg: #ffffff;
    --stage-bg: #fcfcfc;
    --stage-border: #f0f0f0;
    --text: #121212;
    --muted: #999;
    --nav-hover-bg: #fafafa;
    --border: #f0f0f0;
}

html.studio-theme-dark {
    --accent: #e8e8ea;
    --bg: #0b0c0e;
    --sidebar-bg: #0b0c0e;
    --stage-bg: #111722;
    --stage-border: #2a3444;
    --text: #e5e9f0;
    --muted: #8f9aab;
    --nav-hover-bg: #171d29;
    --border: #2a3444;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    height: 100%;
    overflow: hidden;
}

body {
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 0.3s, color 0.3s;
}

/* ===== 窗口标题栏（无边框窗口必需） ===== */
.window-titlebar {
    height: 32px;
    display: flex;
    align-items: stretch;
    background: var(--sidebar-bg);
    border-bottom: 1px solid var(--border);
    user-select: none;
}
.window-drag-region {
    display: flex; align-items: center; flex: 1; min-width: 0;
    padding: 0 12px;
    -webkit-app-region: drag;
}
.window-title {
    font-size: 11px; font-weight: 650; color: var(--muted);
    letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.window-controls { display: flex; align-items: stretch; -webkit-app-region: no-drag; }
.window-control {
    width: 42px; border: none; border-left: 1px solid var(--border);
    background: transparent; color: var(--muted);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background .16s, color .16s;
}
.window-control svg { width: 15px; height: 15px; }
.window-control:hover { background: var(--nav-hover-bg); color: var(--text); }
.window-control-close:hover { background: #C5221F; color: #FFFFFF; }

.app-shell {
    display: flex;
    width: 100%;
    height: calc(100vh - 32px);
    background: var(--bg);
    position: relative;
    transition: background 0.3s;
}

/* ===== 侧边栏 ===== */
.sidebar {
    width: 80px;
    min-width: 80px;
    height: 100vh;
    max-height: 100vh;
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    border-right: 1px solid var(--border);
    padding: 20px 0 12px;
    transition: width 0.5s var(--fluid-ease) 0.5s, background 0.3s, border-color 0.3s;
    z-index: 50;
    overflow: hidden;
}

.sidebar:hover { width: 220px; transition-delay: 0s; }
.sidebar.is-pinned { width: 220px; }
.sidebar.is-pinned .logo-ring { transform: rotate(90deg); border-radius: 50%; }
.sidebar.is-pinned .nav-item { width: 190px; }
.sidebar.is-pinned .nav-text { opacity: 1; }
.sidebar.is-pinned .nav-fold-toggle { width: 190px; }
.sidebar.is-pinned .side-pill { width: 190px; }
.sidebar.is-pinned .side-pill-text { opacity: 1; }

@keyframes sidebar-enter {
    from { opacity: 0; transform: translateX(-6px); }
    to { opacity: 1; transform: translateX(0); }
}
html:not(.studio-route-booting) .sidebar { animation: sidebar-enter 0.5s var(--fluid-ease); }

.logo-ring {
    width: 36px; height: 36px;
    border: 2px solid var(--text);
    border-radius: 12px;
    background: transparent;
    padding: 0;
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    flex: 0 0 auto;
    margin-bottom: 12px;
    font-weight: 700; font-size: 16px;
    transition: transform 0.6s var(--fluid-ease) 0.5s, border-radius 0.6s var(--fluid-ease) 0.5s, border-color 0.3s, background-color .18s;
}
.sidebar:hover .logo-ring { transform: rotate(90deg); border-radius: 50%; transition-delay: 0s; }
.logo-ring:hover, .logo-ring:focus-visible { background: var(--nav-hover-bg); box-shadow: none; outline: 2px solid var(--nav-active); outline-offset: 2px; }

/* ===== 导航项 ===== */
.sidebar nav {
    width: 100%;
    min-height: 0;
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 6px;
    scrollbar-width: thin;
}

.nav-item {
    position: relative;
    width: 48px; height: 48px;
    flex: 0 0 48px;
    margin: 6px 0;
    display: flex; align-items: center; justify-content: flex-start;
    border-radius: 16px;
    cursor: pointer;
    transition: width 0.3s var(--fluid-ease) 0.5s;
    color: var(--muted);
    overflow: hidden;
    padding-left: 14px;
    border: none; background: transparent;
}
.sidebar:hover .nav-item { width: 190px; transition-delay: 0s; }
.nav-item:hover { background: var(--nav-hover-bg); color: var(--text); }
.nav-item.active { background: var(--accent); color: #fff; }
html.studio-theme-dark .nav-item.active { background: #e8e8ea; color: #10141d; }

.nav-item svg { width: 20px; height: 20px; flex: 0 0 auto; }

.nav-text {
    opacity: 0;
    margin-left: 14px;
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    transition: opacity 0.3s 0.5s;
}
.sidebar:hover .nav-text { opacity: 1; transition-delay: 0.1s; }

.nav-fold-toggle {
    position: relative;
    width: 48px; height: 36px;
    flex: 0 0 36px;
    margin: 0 0 4px;
    padding-left: 14px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: transparent;
    color: var(--muted);
    display: flex; align-items: center; justify-content: flex-start;
    cursor: pointer;
    overflow: hidden;
    transition: width 0.3s var(--fluid-ease) 0.5s, background-color 0.2s, color 0.2s, border-color 0.2s;
}
.sidebar:hover .nav-fold-toggle { width: 190px; transition-delay: 0s; }
.nav-fold-toggle:hover { background: var(--nav-hover-bg); color: var(--text); }
.nav-fold-toggle svg { width: 16px; height: 16px; flex: 0 0 auto; transition: transform 0.25s var(--fluid-ease); }
.nav-fold-toggle[aria-expanded="false"] svg { transform: rotate(-90deg); }

.nav-fold-group {
    width: 100%;
    flex: 0 0 auto;
    max-height: 480px;
    opacity: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: max-height 0.3s var(--fluid-ease), opacity 0.2s ease;
}
.nav-fold-group.is-collapsed { max-height: 0; opacity: 0; pointer-events: none; }

.sidebar-divider { width: 32px; height: 1px; background: var(--border); margin: 8px auto; transition: background 0.3s; }

/* ===== 底部操作区 ===== */
.side-actions {
    width: 100%;
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 8px;
}

.side-pill {
    position: relative;
    width: 48px; height: 44px;
    flex: 0 0 44px;
    margin: 4px 0;
    padding-left: 14px;
    border: none;
    border-radius: 14px;
    background: transparent;
    color: var(--muted);
    display: flex; align-items: center; justify-content: flex-start;
    cursor: pointer;
    overflow: hidden;
    transition: width 0.3s var(--fluid-ease) 0.5s, background-color 0.2s, color 0.2s;
}
.sidebar:hover .side-pill { width: 190px; transition-delay: 0s; }
.side-pill:hover { background: var(--nav-hover-bg); color: var(--text); }
.side-pill.active { background: var(--accent); color: #fff; }
html.studio-theme-dark .side-pill.active { background: #e8e8ea; color: #10141d; }

.side-pill svg { width: 20px; height: 20px; flex: 0 0 auto; }
.side-pill.recolor-pill svg { width: 20px; height: 20px; }

.side-pill-text {
    opacity: 0;
    margin-left: 14px;
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    transition: opacity 0.3s 0.5s;
}
.sidebar:hover .side-pill-text { opacity: 1; transition-delay: 0.1s; }

.settings-fold-chevron { margin-left: auto; margin-right: 10px; width: 14px; height: 14px; transition: transform 0.25s var(--fluid-ease); }
.side-pill[aria-expanded="false"] .settings-fold-chevron { transform: rotate(-90deg); }

.settings-fold-group {
    width: 100%;
    flex: 0 0 auto;
    max-height: 240px;
    opacity: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: max-height 0.3s var(--fluid-ease), opacity 0.2s ease;
}
.settings-fold-group.is-collapsed { max-height: 0; opacity: 0; pointer-events: none; }

/* ===== 主舞台区 ===== */
.stage {
    flex: 1;
    background: var(--stage-bg);
    margin: 16px;
    border-radius: 32px;
    overflow: hidden;
    border: 1px solid var(--stage-border);
    position: relative;
    transition: background 0.3s, border-color 0.3s;
}

.stage iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    opacity: 0;
    transform: scale(1.02);
    filter: blur(4px);
    transition: all 0.5s var(--fluid-ease);
    pointer-events: none;
}
.stage iframe.active {
    opacity: 1;
    transform: scale(1);
    filter: blur(0);
    pointer-events: auto;
}
</style>

<script>
(function () {
    // ===== 窗口控制（依赖 Electron preload 暴露的 lavansWindow） =====
    function windowMinimize() { window.lavansWindow?.minimize?.(); }
    function windowToggleMaximize() { window.lavansWindow?.toggleMaximize?.(); }
    function windowClose() { window.lavansWindow?.close?.(); }

    const ACTIVE_PAGE_KEY = 'studio_active_page';
    const SIDEBAR_PINNED_KEY = 'studio_sidebar_pinned';
    const LOCAL_NAV_COLLAPSED_KEY = 'studio_local_nav_collapsed';
    const SIDEBAR_SETTINGS_COLLAPSED_KEY = 'studio_sidebar_settings_collapsed';
    const DEFAULT_PAGE_ID = 'recolor';
    const PAGE_IDS = ['text-studio','enhance','klein','angle','online-studio','gpt-chat','canvas','asset-manager','recolor','api-settings','comfyui-settings'];
    const LOCAL_PAGE_IDS = ['text-studio','enhance','klein','angle'];

    function setSidebarPinned(pinned, options = {}) {
        const sidebar = document.getElementById('studioSidebar');
        const logo = document.getElementById('sidebarLogoToggle');
        if (!sidebar) return;
        sidebar.classList.toggle('is-pinned', pinned);
        if (logo) {
            logo.setAttribute('aria-pressed', pinned ? 'true' : 'false');
            logo.title = pinned ? '收起导航栏' : '固定导航栏';
        }
        if (!options.skipRemember) localStorage.setItem(SIDEBAR_PINNED_KEY, pinned ? '1' : '0');
    }

    function toggleSidebarPinned(event) {
        event && event.preventDefault && event.preventDefault();
        event && event.stopPropagation && event.stopPropagation();
        const sidebar = document.getElementById('studioSidebar');
        setSidebarPinned(!sidebar.classList.contains('is-pinned'));
    }

    function setLocalNavCollapsed(collapsed, options = {}) {
        const group = document.getElementById('local-nav-group');
        const toggle = document.getElementById('local-nav-toggle');
        if (group) group.classList.toggle('is-collapsed', collapsed);
        if (toggle) toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        if (!options.skipRemember) localStorage.setItem(LOCAL_NAV_COLLAPSED_KEY, collapsed ? '1' : '0');
    }

    function toggleLocalNav() {
        const group = document.getElementById('local-nav-group');
        setLocalNavCollapsed(!group.classList.contains('is-collapsed'));
    }

    function setSidebarSettingsCollapsed(collapsed, options = {}) {
        const group = document.getElementById('settings-fold-group');
        const toggle = document.getElementById('settings-fold-toggle');
        if (group) group.classList.toggle('is-collapsed', collapsed);
        if (toggle) toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
        if (!options.skipRemember) localStorage.setItem(SIDEBAR_SETTINGS_COLLAPSED_KEY, collapsed ? '1' : '0');
    }

    function toggleSidebarSettings() {
        const group = document.getElementById('settings-fold-group');
        setSidebarSettingsCollapsed(!group.classList.contains('is-collapsed'));
    }

    function syncThemeToFrame(iframe) {
        const theme = (window.StudioTheme || { get: () => 'light' }).get();
        try { if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage({ type: 'studio-theme', theme }, '*'); } catch (e) {}
    }

    function syncScaleToFrame(iframe) {
        const mode = document.body.classList.contains('studio-scale-host') ? '100' : (window.StudioScale || { getMode: () => 'auto' }).getMode();
        const scale = document.body.classList.contains('studio-scale-host') ? 1 : (window.StudioScale || { getScale: () => 1 }).getScale();
        try { if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage({ type: 'studio-ui-scale', mode, scale }, '*'); } catch (e) {}
    }

    function syncLanguageToFrame(iframe) {
        if (!window.StudioI18n) return;
        try { if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage({ type: 'studio-lang', lang: window.StudioI18n.lang() }, '*'); } catch (e) {}
    }

    function switchUI(el, id, options = {}) {
        if (!PAGE_IDS.includes(id)) id = DEFAULT_PAGE_ID;
        document.body.setAttribute('data-active-page', id);
        document.querySelectorAll('.nav-item,.side-pill').forEach(n => n.classList.remove('active'));
        if (el) el.classList.add('active');
        document.querySelectorAll('.stage iframe').forEach(f => f.classList.remove('active'));
        const target = document.getElementById('frame-' + id);
        if (target) {
            target.classList.add('active');
            if (!target.src) target.src = target.dataset.src;
            if (!options.skipRemember) localStorage.setItem(ACTIVE_PAGE_KEY, id);
            syncThemeToFrame(target);
            syncScaleToFrame(target);
            syncLanguageToFrame(target);
        }
        if (LOCAL_PAGE_IDS.includes(id)) {
            setLocalNavCollapsed(false, { skipRemember: true });
        }
        if (id === 'comfyui-settings') {
            setSidebarSettingsCollapsed(false, { skipRemember: true });
        }
    }

    function updateThemeIcon(theme) {
        const moon = document.getElementById('icon-moon');
        const sun = document.getElementById('icon-sun');
        const dark = theme === 'dark';
        if (moon) moon.style.display = dark ? 'none' : 'block';
        if (sun) sun.style.display = dark ? 'block' : 'none';
    }

    function broadcastTheme(theme) {
        if (window.StudioTheme) window.StudioTheme.set(theme);
        document.querySelectorAll('.stage iframe').forEach(f => syncThemeToFrame(f));
        updateThemeIcon(theme);
    }

    function toggleTheme() {
        const current = (window.StudioTheme || { get: () => 'light' }).get();
        broadcastTheme(current === 'dark' ? 'light' : 'dark');
    }

    function toggleLanguage() {
        if (!window.StudioI18n) return;
        window.StudioI18n.toggle();
        document.querySelectorAll('.stage iframe').forEach(f => syncLanguageToFrame(f));
    }

    function openProjectPage() {
        const url = (window.BRAND_CONFIG && window.BRAND_CONFIG.repoUrl) || 'https://github.com/liamwong-1987/LANVAS';
        window.open(url, '_blank', 'noopener');
    }

    // 监听主题变化事件（theme.js 触发）
    window.addEventListener('studio-theme-change', (e) => updateThemeIcon(e.detail.theme));

    // 监听子 iframe 转发的 API 变化消息
    window.addEventListener('message', (event) => {
        if (event.origin && event.origin !== location.origin) return;
        const data = event.data;
        if (data?.type === 'recolor-modal-state' && event.source === document.getElementById('frame-recolor')?.contentWindow) {
            document.body.classList.toggle('recolor-modal-open', Boolean(data.open));
            return;
        }
        if (data && ['providers-changed','workflows-changed','comfy-instances-changed'].includes(data.type)) {
            document.querySelectorAll('.stage iframe').forEach(iframe => {
                try { if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage(data, '*'); } catch (e) {}
            });
        }
    });

    function restoreActivePage() {
        const savedPinned = localStorage.getItem(SIDEBAR_PINNED_KEY);
        setSidebarPinned(savedPinned === null ? true : savedPinned === '1', { skipRemember: true });
        setLocalNavCollapsed(localStorage.getItem(LOCAL_NAV_COLLAPSED_KEY) === '1', { skipRemember: true });
        setSidebarSettingsCollapsed(localStorage.getItem(SIDEBAR_SETTINGS_COLLAPSED_KEY) === '1', { skipRemember: true });
        const savedId = localStorage.getItem(ACTIVE_PAGE_KEY);
        const id = PAGE_IDS.includes(savedId) ? savedId : DEFAULT_PAGE_ID;
        const trigger = document.querySelector('[onclick*="\'' + id + '\'"], [onclick*="&quot;' + id + '&quot;"]');
        switchUI(trigger, id, { skipRemember: true });
        document.documentElement.classList.remove('studio-route-booting');
        const theme = (window.StudioTheme || { get: () => 'light' }).get();
        updateThemeIcon(theme);
    }

    // iframe 首次 load 后同步主题/缩放/语言
    document.querySelectorAll('.stage iframe').forEach(f => {
        f.addEventListener('load', () => {
            syncThemeToFrame(f);
            syncScaleToFrame(f);
            syncLanguageToFrame(f);
        });
    });

    document.addEventListener('DOMContentLoaded', restoreActivePage, { once: true });

    // 暴露给全局（供调试/后续扩展）
    window.windowMinimize = windowMinimize;
    window.windowToggleMaximize = windowToggleMaximize;
    window.windowClose = windowClose;
    window.switchUI = switchUI;
    window.toggleSidebarPinned = toggleSidebarPinned;
    window.toggleLocalNav = toggleLocalNav;
    window.toggleSidebarSettings = toggleSidebarSettings;
    window.toggleTheme = toggleTheme;
    window.toggleLanguage = toggleLanguage;
    window.openProjectPage = openProjectPage;
})();
</script>

</body>
