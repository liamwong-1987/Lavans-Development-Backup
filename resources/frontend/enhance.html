<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="enhance.title">细节增强</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
                if(theme === 'dark') { document.documentElement.classList.add('studio-theme-dark'); document.documentElement.classList.add('theme-dark'); }
            } catch(e) {}
        })();
    </script>
    <script src="/vendor/js/tailwindcss-cdn.js"></script>
    <script src="/smart-canvas-core/vendor/js/lucide.js"></script>
    <script src="/smart-canvas-core/i18n.js"></script>
    <script src="/brand-config.js"></script>
    <script src="/history-bulk-manager.js"></script>
    <style>
        :root { --accent:#111827; --bg:#f9fafb; --card:#ffffff; --easing:cubic-bezier(0.4,0,0.2,1); }
        *::-webkit-scrollbar { width:10px !important; height:10px !important; background:transparent !important; }
        *::-webkit-scrollbar-track { background:transparent !important; border:none !important; }
        *::-webkit-scrollbar-thumb { background-color:#d8d8d8 !important; border:3px solid transparent !important; border-right-width:5px !important; background-clip:padding-box !important; border-radius:10px !important; }
        *::-webkit-scrollbar-thumb:hover { background-color:#c0c0c0 !important; }
        *::-webkit-scrollbar-corner { background:transparent !important; }
        * { scrollbar-width:thin !important; scrollbar-color:#d8d8d8 transparent !important; }
        body { background-color:var(--bg); font-family:'Inter',-apple-system,sans-serif; color:var(--accent); -webkit-font-smoothing:antialiased; }
        .container-box { max-width:1280px; margin:0 auto; padding:0 40px; margin-top:50px; }
        .glass-btn { background:#111827; transition:all .3s var(--easing); }
        .glass-btn:hover { background:#000; transform:translateY(-1px); box-shadow:0 12px 24px rgba(0,0,0,.1); }
        .glass-btn:active { transform:scale(.98); }
        .upload-item { background:var(--card); border:1px dashed #e2e8f0; transition:all .4s var(--easing); }
        .upload-item:hover { border-color:#000; background:#fff; transform:translateY(-2px); }
        .result-frame { background:#fff; border-radius:32px; border:1px solid #f1f5f9; box-shadow:0 2px 15px rgba(0,0,0,.02); }
        .masonry-item { break-inside:avoid; margin-bottom:1.25rem; background:#fff; border:1px solid #f1f5f9; border-radius:24px; overflow:hidden; transition:all .5s var(--easing); }
        .masonry-item:hover { transform:translateY(-6px); box-shadow:0 20px 40px rgba(0,0,0,.08); }
        input[type=range] { -webkit-appearance:none; background:transparent; }
        input[type=range]::-webkit-slider-runnable-track { width:100%; height:2px; background:#e5e5e5; border-radius:1px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; height:14px; width:14px; border-radius:50%; background:var(--accent); margin-top:-6px; box-shadow:0 1px 4px rgba(0,0,0,.2); transition:transform .2s var(--easing); cursor:pointer; }
        .masonry-grid { columns:2; column-gap:1.25rem; }
        @media (min-width:768px){ .masonry-grid { columns:4; } }
        @keyframes b-loading { 0%{transform:scale(1);background:#000;} 50%{transform:scale(1.15);background:#444;} 100%{transform:scale(1);background:#000;} }
        .loading-box { width:10px; height:10px; animation:b-loading 1s infinite var(--easing); }
        .ios-switch input:checked+.ios-slider { background:#000; }
        .ios-slider:before { content:""; position:absolute; height:24px; width:24px; left:2px; bottom:2px; background:white; border-radius:50%; transition:.3s var(--easing); box-shadow:0 1px 3px rgba(0,0,0,.15); }
        input:checked+.ios-slider:before { transform:translateX(20px); }
    </style>
<script src="/smart-canvas-core/theme.js"></script>
  <link rel="stylesheet" href="/lanvas-unified.css?v=2026.08.21.1">
</head>
<body class="selection:bg-black selection:text-white">

    <div class="container-box">
        <header class="flex flex-col md:flex-row justify-between items-end mb-16 gap-6">
            <div class="space-y-1">
                <h1 class="text-4xl font-extrabold tracking-[-0.05em] flex items-center" data-i18n="enhance.title">细节增强<span class="text-base mt-3 ml-1">®</span></h1>
                <p class="text-[10px] font-bold uppercase tracking-[0.5em] text-gray-400" data-i18n="enhance.subtitle">计算摄影档案</p>
            </div>
            <nav class="flex gap-8 text-[11px] font-bold uppercase tracking-widest text-gray-500">
                <span class="text-black border-b-2 border-black pb-1" data-i18n="enhance.title">细节增强</span>
            </nav>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-12 gap-12">
            <div class="lg:col-span-4 space-y-10">
                <section class="group">
                    <h3 class="text-[9px] font-black uppercase tracking-[0.3em] mb-5 text-gray-400">01. <span data-i18n="enhance.inputSource">输入源</span></h3>
                    <div id="dropzone" class="upload-item relative overflow-hidden rounded-2xl aspect-[4/3] flex flex-col items-center justify-center cursor-pointer">
                        <input type="file" id="fileInput" class="hidden" accept="image/*">
                        <div id="uploadContent" class="text-center space-y-4">
                            <div class="w-14 h-14 rounded-full border border-gray-200 bg-white flex items-center justify-center mx-auto group-hover:bg-black group-hover:text-white group-hover:border-black transition-all duration-500">
                                <i data-lucide="arrow-up" class="w-5 h-5"></i>
                            </div>
                            <p class="text-[11px] font-bold uppercase tracking-tight" data-i18n="studio.dropImage">拖拽图片到这里</p>
                        </div>
                        <img id="previewImg" class="hidden absolute inset-0 w-full h-full object-cover">
                        <div id="changeOverlay" class="hidden absolute inset-0 bg-black/10 backdrop-blur-sm items-center justify-center opacity-0 hover:opacity-100 transition-opacity">
                            <span class="bg-white px-5 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest shadow-2xl" data-i18n="studio.change">更换</span>
                        </div>
                    </div>
                </section>

                <section class="space-y-10">
                    <h3 class="text-[9px] font-black uppercase tracking-[0.3em] text-gray-400">02. <span data-i18n="enhance.parameters">参数</span></h3>
                    <div id="localControls" class="space-y-10">
                        <div class="space-y-5">
                            <div class="flex justify-between items-end">
                                <label class="text-xs font-bold uppercase tracking-tight text-gray-800" data-i18n="enhance.strength">细节增强强度</label>
                                <span id="strengthVal" class="font-mono text-xs font-bold">0.50</span>
                            </div>
                            <input type="range" id="strengthSlider" min="0.1" max="1.0" step="0.01" value="0.5" class="w-full">
                        </div>
                        <div class="p-5 bg-white border border-gray-200/50 rounded-2xl shadow-sm">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center gap-4">
                                    <div class="p-2.5 bg-gray-50 rounded-xl border border-gray-100"><i data-lucide="layers" class="w-4 h-4"></i></div>
                                    <div>
                                        <p class="text-[11px] font-bold uppercase" data-i18n="enhance.superResolution">超分辨率</p>
                                        <p class="text-[9px] text-gray-400" data-i18n="enhance.pixelDouble">像素翻倍（4K）</p>
                                    </div>
                                </div>
                                <label class="ios-switch relative inline-block w-12 h-7">
                                    <input type="checkbox" id="upscaleToggle" class="opacity-0 w-0 h-0" onchange="toggleUpscaleOptions()">
                                    <span class="ios-slider absolute inset-0 cursor-pointer bg-gray-200 rounded-full transition-colors duration-300"></span>
                                </label>
                            </div>
                            <div id="upscaleOptions" class="hidden pt-4 mt-4 border-t border-gray-100 grid-cols-2 gap-3">
                                <button id="btn2x" onclick="setUpscaleFactor(2048)" class="py-2.5 rounded-xl border border-black bg-black text-white text-[10px] font-bold transition-all">2x (2K)</button>
                                <button id="btn4x" onclick="setUpscaleFactor(4096)" class="py-2.5 rounded-xl border border-gray-200 text-gray-400 text-[10px] font-bold hover:border-black hover:text-black transition-all">4x (4K)</button>
                            </div>
                        </div>
                    </div>

                    <button id="genBtn" onclick="handleGenerate()" class="glass-btn w-full py-5 text-white rounded-xl font-bold text-[11px] uppercase tracking-[0.4em] flex items-center justify-center gap-3 shadow-xl shadow-black/10 disabled:opacity-50 disabled:cursor-not-allowed">
                        <i data-lucide="zap" id="btnIcon" class="w-4 h-4 text-yellow-400"></i>
                        <span id="btnText" data-i18n="enhance.beginRemaster">开始重制</span>
                    </button>
                </section>
            </div>

            <div class="lg:col-span-8">
                <div id="resultBox" class="result-frame relative h-[500px] lg:h-[650px] flex items-center justify-center overflow-hidden group">
                    <div id="emptyState" class="text-center space-y-4 opacity-20">
                        <i data-lucide="layout" class="w-12 h-12 mx-auto stroke-[1px]"></i>
                        <p class="text-[10px] font-black tracking-[0.5em] uppercase" data-i18n="studio.canvasReady">画布就绪</p>
                    </div>
                    <div id="loadingState" class="hidden flex flex-col items-center gap-5">
                        <div class="loading-box"></div>
                        <p class="text-[10px] font-bold uppercase tracking-[0.4em] animate-pulse" data-i18n="enhance.computingPixels">计算像素中...</p>
                    </div>
                    <img id="outputImg" class="hidden w-full h-full object-contain p-8 cursor-zoom-in transition-all duration-700 hover:scale-[1.02]" onclick="zoomImage()">
                    <a id="downloadBtn" href="#" download class="hidden absolute bottom-8 right-8 w-14 h-14 bg-white shadow-2xl rounded-2xl flex items-center justify-center hover:bg-black hover:text-white transition-all duration-500 border border-gray-100">
                        <i data-lucide="download" class="w-5 h-5"></i>
                    </a>
                </div>
            </div>
        </main>

        <section class="mt-32">
            <div class="flex items-center gap-6 mb-10">
                <h2 class="text-[11px] font-black uppercase tracking-[0.5em]" data-i18n="enhance.archives">归档</h2>
                <div class="h-px flex-1 bg-black/5"></div>
            </div>
            <div id="masonry" class="masonry-grid"></div>
            <div id="loadMoreTrigger" class="py-16 text-center opacity-20 text-[10px] font-bold uppercase tracking-widest" data-i18n="enhance.archiveEnd">归档结束</div>
        </section>
    </div>

    <div id="lightbox" onclick="handleOutsideClick(event)" class="hidden fixed inset-0 z-50 bg-white/95 backdrop-blur-3xl flex items-center justify-center p-8">
        <button onclick="closeLightbox()" class="absolute top-10 right-10 p-2 hover:rotate-90 transition-transform duration-500">
            <i data-lucide="x" class="w-8 h-8"></i>
        </button>
        <div class="max-w-6xl w-full h-full flex flex-col items-center justify-center">
            <div class="relative w-full flex justify-center">
                <div id="compareContainer" class="hidden relative w-full h-[75vh] rounded-3xl overflow-hidden bg-[#f8f8f9] border border-gray-200/50 shadow-2xl">
                    <img id="compareGenerated" class="absolute inset-0 w-full h-full object-contain">
                    <div id="compareOriginalWrapper" class="absolute inset-0 w-full h-full overflow-hidden border-r-2 border-white/80">
                        <img id="compareOriginal" class="absolute inset-0 w-full h-full object-contain">
                    </div>
                    <div id="compareSlider" class="absolute inset-y-0 left-1/2 w-0.5 bg-white z-20 cursor-ew-resize">
                        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-10 h-10 bg-white shadow-2xl rounded-full flex items-center justify-center border border-gray-100">
                            <i data-lucide="move-horizontal" class="w-4 h-4 text-black"></i>
                        </div>
                    </div>
                </div>
                <div id="lightboxFrame" class="hidden relative">
                    <img id="lightboxImg" src="" class="max-w-[92vw] max-h-[78vh] object-contain" alt="preview">
                    <div id="lightboxRes" class="absolute top-4 left-4 bg-black/30 backdrop-blur-md border border-white/20 text-white px-3 py-1.5 rounded-full text-[10px] font-medium tracking-wider opacity-0 transition-opacity duration-300 pointer-events-none z-30"></div>
                </div>
            </div>
            <div class="mt-8">
                <button onclick="downloadLightboxImage()" class="px-10 py-4 bg-black text-white rounded-full text-[10px] font-black uppercase tracking-widest flex items-center gap-3 shadow-xl">
                    <i data-lucide="save" class="w-4 h-4"></i> <span data-i18n="enhance.saveOutput">保存成品</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        if(window.lucide) lucide.createIcons();
        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) { try { return crypto.randomUUID(); } catch (e) {} }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = Math.random()*16|0, v = c=='x'?r:(r&0x3|0x8); return v.toString(16); });
        }
        const CLIENT_ID = localStorage.getItem("client_id") || generateUUID();
        localStorage.setItem("client_id", CLIENT_ID);

        let uploadedPath = "";
        let currentResult = null;
        let currentUpscaleFactor = 2048;

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');
        const slider = document.getElementById('strengthSlider');
        const valDisplay = document.getElementById('strengthVal');

        function setUpscaleFactor(factor) {
            currentUpscaleFactor = factor;
            const btn2x = document.getElementById('btn2x');
            const btn4x = document.getElementById('btn4x');
            const setActive = (btn) => { btn.className = "py-2.5 rounded-xl border border-black bg-black text-white text-[10px] font-bold transition-all"; };
            const setInactive = (btn) => { btn.className = "py-2.5 rounded-xl border border-gray-200 text-gray-400 text-[10px] font-bold hover:border-black hover:text-black transition-all"; };
            if (factor === 2048) { setActive(btn2x); setInactive(btn4x); } else { setInactive(btn2x); setActive(btn4x); }
        }

        dropzone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);
        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('border-black','bg-gray-50'); });
        dropzone.addEventListener('dragleave', () => { dropzone.classList.remove('border-black','bg-gray-50'); });
        dropzone.addEventListener('drop', (e) => { e.preventDefault(); dropzone.classList.remove('border-black','bg-gray-50'); if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
        let isHovering = false;
        dropzone.addEventListener('mouseenter', () => isHovering = true);
        dropzone.addEventListener('mouseleave', () => isHovering = false);
        window.addEventListener('paste', (e) => {
            if (!isHovering) return;
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) { if (item.kind === 'file' && item.type.startsWith('image/')) { handleFile(item.getAsFile()); break; } }
        });

        slider.oninput = function () { valDisplay.innerText = parseFloat(this.value).toFixed(2); };

        async function handleFile(file) {
            if (!file) return;
            const btn = document.getElementById('genBtn');
            const btnText = document.getElementById('btnText');
            btn.disabled = true;
            btnText.innerText = StudioI18n.t('enhance.uploading');
            const reader = new FileReader();
            reader.onload = (e) => { previewImg.src = e.target.result; previewImg.classList.remove('hidden'); document.getElementById('uploadContent').classList.add('opacity-0'); document.getElementById('changeOverlay').classList.replace('hidden','flex'); };
            reader.readAsDataURL(file);
            const formData = new FormData();
            formData.append('files', file);
            try {
                const res = await fetch('/api/comfy/upload', { method:'POST', body:formData });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || StudioI18n.t('enhance.uploadFailed'));
                uploadedPath = data.files[0].comfy_name;
                btn.disabled = false;
                btnText.innerText = StudioI18n.t('enhance.beginRemaster');
            } catch (err) {
                console.error('上传失败', err);
                btnText.innerText = StudioI18n.t('enhance.uploadFailed');
                btn.disabled = false;
            }
        }

        function toggleUpscaleOptions() {
            const toggle = document.getElementById('upscaleToggle');
            const options = document.getElementById('upscaleOptions');
            if (toggle.checked) { options.classList.remove('hidden'); options.classList.add('grid'); }
            else { options.classList.add('hidden'); options.classList.remove('grid'); }
        }

        async function handleGenerate() {
            if (!uploadedPath) {
                dropzone.style.transition = "0.2s";
                dropzone.style.borderColor = "#ef4444";
                dropzone.style.transform = "scale(0.98)";
                setTimeout(() => { dropzone.style.borderColor = ""; dropzone.style.transform = "scale(1)"; }, 300);
                return;
            }
            const btn = document.getElementById('genBtn');
            btn.disabled = true;
            btn.style.backgroundColor = '#333';
            btn.innerHTML = `<i data-lucide="zap" class="w-4 h-4 text-yellow-400 fill-yellow-400 animate-pulse"></i><span class="tracking-[0.4em] text-[11px] uppercase">${StudioI18n.t('enhance.generating')}</span>`;
            if(window.lucide) lucide.createIcons();
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('outputImg').classList.add('hidden');
            document.getElementById('loadingState').classList.remove('hidden');

            let debugStep = "Start";
            try {
                let finalData;
                const isUpscale = document.getElementById('upscaleToggle').checked;

                debugStep = "Phase 1 Request";
                btn.innerHTML = `<i data-lucide="zap" class="w-4 h-4 text-yellow-400 fill-yellow-400 animate-pulse"></i><span class="tracking-[0.4em] text-[11px] uppercase">${isUpscale ? StudioI18n.t('enhance.phase1Enhance') : StudioI18n.t('enhance.generating')}</span>`;
                if(window.lucide) lucide.createIcons();

                const enhanceRes = await fetch('/api/generate', {
                    method:'POST', headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ workflow_json:"Z-Image-Enhance.json", params:{"15":{"image":uploadedPath},"204":{"value":parseFloat(slider.value)}}, type:"enhance", client_id:CLIENT_ID })
                });
                const enhanceData = await enhanceRes.json();
                if (!enhanceRes.ok) throw new Error(enhanceData.detail || StudioI18n.t('enhance.enhanceFailed'));
                if (!enhanceData.images?.length) throw new Error(StudioI18n.t('enhance.enhanceNoImage'));

                finalData = enhanceData;

                if (isUpscale) {
                    debugStep = "Phase 2 Preparation";
                    btn.innerHTML = `<i data-lucide="zap" class="w-4 h-4 text-yellow-400 fill-yellow-400 animate-pulse"></i><span class="tracking-[0.4em] text-[11px] uppercase">${StudioI18n.t('enhance.phase2Upload')}</span>`;
                    if(window.lucide) lucide.createIcons();

                    const imgUrl = enhanceData.images[0];
                    let imgBlob;
                    try { const blobRes = await fetch(imgUrl); if (!blobRes.ok) throw new Error(`HTTP ${blobRes.status}`); imgBlob = await blobRes.blob(); }
                    catch (e) { throw new Error(`${StudioI18n.t('enhance.fetchPhase1Failed')}：${e.message}`); }

                    debugStep = "Phase 2 Upload";
                    const formData = new FormData();
                    formData.append('files', imgBlob, 'temp_upscale_input.png');
                    const uploadRes = await fetch('/api/comfy/upload', { method:'POST', body:formData });
                    if (!uploadRes.ok) throw new Error(`${StudioI18n.t('enhance.uploadFailed')} HTTP ${uploadRes.status}`);
                    const uploadData = await uploadRes.json();
                    if (!uploadData.files?.[0]) throw new Error(StudioI18n.t('enhance.midUploadFailed'));
                    const uploadedInput = uploadData.files[0].comfy_name;

                    debugStep = "Phase 2 Execution";
                    btn.innerHTML = `<i data-lucide="zap" class="w-4 h-4 text-yellow-400 fill-yellow-400 animate-pulse"></i><span class="tracking-[0.4em] text-[11px] uppercase">${StudioI18n.t('enhance.phase2Upscale')}</span>`;
                    if(window.lucide) lucide.createIcons();
                    const seed = Math.floor(Math.random() * 4294967295);
                    const upscaleRes = await fetch('/api/generate', {
                        method:'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({ workflow_json:"upscale.json", params:{"15":{"image":uploadedInput},"172":{"seed":seed,"resolution":currentUpscaleFactor}}, type:"enhance", client_id:CLIENT_ID })
                    });
                    finalData = await upscaleRes.json();
                    if (!upscaleRes.ok) throw new Error(finalData.detail || StudioI18n.t('enhance.upscaleFailed'));
                    if (!finalData.images?.length) throw new Error(StudioI18n.t('enhance.upscaleNoImage'));
                }

                currentResult = finalData;
                const out = document.getElementById('outputImg');
                out.src = finalData.images[0];
                out.classList.remove('hidden');
                document.getElementById('downloadBtn').classList.remove('hidden');
                document.getElementById('downloadBtn').href = finalData.images[0];
                document.getElementById('loadingState').classList.add('hidden');
                renderImageCard(finalData, true);

            } catch (error) {
                console.error("生成错误 " + debugStep, error);
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('loadingState').classList.add('hidden');
                alert(`${StudioI18n.t('enhance.generateFailedAt')}（${debugStep}）：${error.message || JSON.stringify(error)}`);
            } finally {
                btn.disabled = false;
                btn.style.backgroundColor = '';
                btn.innerHTML = `<i data-lucide="zap" class="w-4 h-4 text-yellow-400"></i><span id="btnText" data-i18n="enhance.beginRemaster">${StudioI18n.t('enhance.beginRemaster')}</span>`;
                if(window.lucide) lucide.createIcons();
            }
        }

        function zoomImage() {
            if (currentResult) {
                if (!currentResult.params && uploadedPath) currentResult.params = { "15": { "image": uploadedPath } };
                openLightbox(currentResult);
            }
        }

        function renderImageCard(data, isNew = false) {
            const imgUrl = data.images?.[0] || data.outputUrl;
            if (!imgUrl) return;
            const ts = data.id || data.timestamp || data.createdAt || Date.now();
            const masonry = document.getElementById('masonry');
            if (document.getElementById(`h-${ts}`)) return;
            const card = document.createElement('div');
            card.id = `h-${ts}`;
            card.dataset.historyTs = String(ts);
            card.className = 'masonry-item group relative rounded-2xl overflow-hidden cursor-zoom-in';
            card.onclick = () => { if(document.body.classList.contains('history-bulk-selecting')) return; openLightbox(data); };
            card.innerHTML = `<img src="${imgUrl}" class="w-full h-auto block transform group-hover:scale-105 transition-transform duration-1000"><div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-end p-5"><p class="text-white text-[9px] font-black uppercase tracking-widest" data-i18n="enhance.remasterArchive">${StudioI18n.t('enhance.remasterArchive')}</p></div>`;
            isNew ? masonry.prepend(card) : masonry.appendChild(card);
        }

        function initCompareEvents() {
            const container = document.getElementById('compareContainer');
            const wrapper = document.getElementById('compareOriginalWrapper');
            const slider = document.getElementById('compareSlider');
            let isDragging = false;
            const updateSlider = (clientX) => {
                const rect = container.getBoundingClientRect();
                let percent = ((clientX - rect.left) / rect.width) * 100;
                percent = Math.max(0, Math.min(100, percent));
                wrapper.style.clipPath = `inset(0 ${100 - percent}% 0 0)`;
                slider.style.left = `${percent}%`;
            };
            const start = (e) => { isDragging = true; e.preventDefault(); };
            const end = () => isDragging = false;
            const move = (e) => { if (!isDragging) return; const clientX = e.touches ? e.touches[0].clientX : e.clientX; updateSlider(clientX); };
            container.addEventListener('mousedown', (e) => { if (e.target === slider) return; updateSlider(e.clientX); start(e); });
            slider.addEventListener('mousedown', start);
            window.addEventListener('mouseup', end);
            window.addEventListener('mousemove', move);
            slider.addEventListener('touchstart', start, { passive:false });
            window.addEventListener('touchend', end);
            window.addEventListener('touchmove', move, { passive:false });
        }

        function openLightbox(data) {
            const compare = document.getElementById('compareContainer');
            const frame = document.getElementById('lightboxFrame');
            const single = document.getElementById('lightboxImg');
            const resPill = document.getElementById('lightboxRes');
            resPill.style.opacity = '0';
            const updateRes = (target) => { if (target.naturalWidth) { resPill.innerText = `${target.naturalWidth} x ${target.naturalHeight}`; resPill.style.opacity = '1'; } };
            if (data.params?.["15"]?.image) {
                compare.classList.remove('hidden'); frame.classList.add('hidden');
                const genImg = document.getElementById('compareGenerated');
                document.getElementById('compareOriginal').src = `/api/view?filename=${encodeURIComponent(data.params["15"].image)}&type=input`;
                genImg.src = data.images?.[0] || data.outputUrl;
                document.getElementById('compareOriginalWrapper').style.clipPath = 'inset(0 50% 0 0)';
                document.getElementById('compareSlider').style.left = '50%';
                genImg.onload = () => updateRes(genImg);
                if (genImg.complete) updateRes(genImg);
            } else {
                compare.classList.add('hidden'); frame.classList.remove('hidden');
                single.src = data.images?.[0] || data.outputUrl;
                single.onload = () => updateRes(single);
                if (single.complete) updateRes(single);
            }
            document.getElementById('lightbox').classList.replace('hidden','flex');
            document.body.style.overflow = 'hidden';
        }
        function closeLightbox() { document.getElementById('lightbox').classList.replace('flex','hidden'); document.body.style.overflow = 'auto'; }
        function handleOutsideClick(e) { if (e.target.id === 'lightbox') closeLightbox(); }
        function downloadLightboxImage() {
            const url = currentResult?.images?.[0] || document.getElementById('lightboxImg').src || document.getElementById('compareGenerated').src;
            if (!url) return;
            const a = document.createElement('a'); a.href = url; a.download = `enhance-${Date.now()}.png`; a.click();
        }

        async function loadHistory() {
            try {
                const res = await fetch('/api/canvas/image-history');
                const data = await res.json();
                (data.history || []).forEach(item => renderImageCard(item));
            } catch (e) {}
        }

        window.onload = () => {
            loadHistory().then(() => window.HistoryBulkManager?.attach({container:'#masonry'}));
            initCompareEvents();
        };
    </script>
