    <style>
        :root { --accent:#111827; --bg:#f9fafb; --card:#ffffff; --easing:cubic-bezier(0.4,0,0.2,1); }
        *::-webkit-scrollbar { width:10px!important; height:10px!important; background:transparent!important; }
        *::-webkit-scrollbar-track { background:transparent!important; border:none!important; }
        *::-webkit-scrollbar-thumb { background-color:#d8d8d8!important; border:3px solid transparent!important; border-right-width:5px!important; background-clip:padding-box!important; border-radius:10px!important; }
        *::-webkit-scrollbar-thumb:hover { background-color:#c0c0c0!important; }
        *::-webkit-scrollbar-corner { background:transparent!important; }
        * { scrollbar-width:thin!important; scrollbar-color:#d8d8d8 transparent!important; }
        body { background-color:var(--bg); font-family:'Inter',-apple-system,sans-serif; color:var(--accent); -webkit-font-smoothing:antialiased; }
        .container-box { max-width:1280px; margin:0 auto; padding:0 40px; margin-top:50px; }
        .glass-btn { background:#111827; transition:all .3s var(--easing); }
        .glass-btn:hover { background:#000; transform:translateY(-1px); box-shadow:0 12px 24px rgba(0,0,0,.1); }
        .glass-btn:active { transform:scale(.98); }
        .upload-item { background:var(--card); border:1px dashed #e2e8f0; transition:all .4s var(--easing); }
        .upload-item:hover { border-color:#000; background:#fff; transform:translateY(-2px); }
        .result-frame { background:#fff; border-radius:32px; border:1px solid #f1f5f9; box-shadow:0 2px 15px rgba(0,0,0,.02); }
        .masonry-grid { columns:2; column-gap:1.25rem; }
        @media (min-width:768px){ .masonry-grid { columns:4; } }
        .masonry-item { break-inside:avoid; margin-bottom:1.25rem; background:#fff; border:1px solid #f1f5f9; border-radius:24px; overflow:hidden; transition:all .5s var(--easing); }
        .masonry-item:hover { transform:translateY(-6px); box-shadow:0 20px 40px rgba(0,0,0,.08); }
        input[type=range] { -webkit-appearance:none; background:transparent; }
        input[type=range]::-webkit-slider-runnable-track { width:100%; height:2px; background:#e5e5e5; border-radius:1px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; height:14px; width:14px; border-radius:50%; background:var(--accent); margin-top:-6px; box-shadow:0 1px 4px rgba(0,0,0,.2); transition:transform .2s var(--easing); cursor:pointer; }
        .nano-input { background:var(--card); border:1px solid #eef0f2; transition:all .3s var(--easing); }
        .nano-input:focus { border-color:#000; box-shadow:0 0 0 1px #000; }
        .mode-switcher { background:#f8fafc; border:1px solid #edf2f7; border-radius:999px; padding:3px; display:grid; grid-template-columns:1fr 1fr; gap:2px; position:relative; }
        .mode-btn { border-radius:999px; height:34px; display:flex; align-items:center; justify-content:center; gap:6px; color:#64748b; font-size:10px; font-weight:600; letter-spacing:.02em; transition:all .25s var(--easing); cursor:pointer; z-index:1; }
        .mode-btn.active { color:#111827; }
        .mode-glider { position:absolute; top:3px; left:3px; width:calc(50% - 3px); height:34px; background:#fff; border-radius:999px; box-shadow:0 1px 3px rgba(15,23,42,.08); transition:transform .25s var(--easing); }
        @keyframes b-loading { 0%{transform:scale(1);background:#000;} 50%{transform:scale(1.15);background:#444;} 100%{transform:scale(1);background:#000;} }
        .loading-box { width:10px; height:10px; animation:b-loading 1s infinite var(--easing); }
    </style>

    <script type="module">
        import * as THREE from 'three';
        const container = document.getElementById('threeContainer');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);
        const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth || 300, container.clientHeight || 200);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);
        const geometry = new THREE.PlaneGeometry(3, 3);
        const material = new THREE.MeshStandardMaterial({ color: 0x444444, side: THREE.DoubleSide });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
        const gridHelper = new THREE.GridHelper(20, 20, 0x444444, 0x333333);
        scene.add(gridHelper);
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const pointLight = new THREE.DirectionalLight(0xffffff, 1);
        pointLight.position.set(5, 10, 7);
        scene.add(pointLight);

        const sliderH = document.getElementById('rotate-h');
        const sliderV = document.getElementById('rotate-v');
        const sliderD = document.getElementById('distance');
        const valH = document.getElementById('val-horizontal');
        const valV = document.getElementById('val-vertical');
        const valD = document.getElementById('val-distance');

        window.updateCamera = function () {
            const lon = parseFloat(sliderH.value);
            const lat = parseFloat(sliderV.value);
            const dist = parseFloat(sliderD.value);
            if (document.activeElement !== valH) valH.value = lon;
            if (document.activeElement !== valV) valV.value = lat;
            if (document.activeElement !== valD) valD.value = dist.toFixed(1);
            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);
            camera.position.x = dist * Math.sin(phi) * Math.sin(theta);
            camera.position.y = dist * Math.cos(phi);
            camera.position.z = dist * Math.sin(phi) * Math.cos(theta);
            camera.lookAt(0, 0, 0);
            updatePromptWithAngle(lon, lat, dist);
        };
        window.syncInput = (type) => {
            if (type === 'h') { let v = parseFloat(valH.value); if (!isNaN(v)) sliderH.value = v; }
            else if (type === 'v') { let v = parseFloat(valV.value); if (!isNaN(v)) sliderV.value = v; }
            else if (type === 'd') { let v = parseFloat(valD.value); if (!isNaN(v)) sliderD.value = v; }
            window.updateCamera();
        };
        window.resetControl = (type) => {
            if (type === 'h') { sliderH.value = 0; valH.value = 0; }
            else if (type === 'v') { sliderV.value = 0; valV.value = 0; }
            else if (type === 'd') { sliderD.value = 4; valD.value = 4; }
            window.updateCamera();
        };

        function updatePromptWithAngle(h, v, d) {
            let parts = [];
            if (h !== 0) { const dir = h > 0 ? StudioI18n.t('angle.right') : StudioI18n.t('angle.left'); parts.push(`${dir}${StudioI18n.t('angle.rotateDeg').replace('{deg}', Math.abs(h))}`); }
            if (v !== 0) { const dir = v > 0 ? StudioI18n.t('angle.overlook') : StudioI18n.t('angle.lookup'); parts.push(`${dir}${StudioI18n.t('angle.lookDeg').replace('{deg}', Math.abs(v))}`); }
            let lensText = "";
            if (d > 4) lensText = StudioI18n.t('angle.wideLens');
            else if (d < 4) lensText = StudioI18n.t('angle.closeupLens');
            let resultText = "";
            if (parts.length > 0) resultText = `${StudioI18n.t('angle.moveCamera')}${parts.join("，")}`;
            if (lensText) resultText += (resultText ? "，" : StudioI18n.t('angle.moveCamera')) + lensText;
            const promptInput = document.getElementById('promptInput');
            let currentText = promptInput.value;
            const cameraPrefix = StudioI18n.t('angle.moveCamera');
            const regex = new RegExp(cameraPrefix + '.*?(?=(\\n|$))', 'g');
            if (regex.test(currentText)) promptInput.value = currentText.replace(regex, resultText);
            else if (resultText) promptInput.value = currentText.trim() ? currentText.trim() + '\n' + resultText : resultText;
        }

        sliderH.addEventListener('input', window.updateCamera);
        sliderV.addEventListener('input', window.updateCamera);
        sliderD.addEventListener('input', window.updateCamera);
        window.updateCamera();

        function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
        animate();

        const resizeObserver = new ResizeObserver(() => {
            const w = container.clientWidth; const h = container.clientHeight;
            camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h);
        });
        resizeObserver.observe(container);

        window.update3DTexture = (url) => {
            new THREE.TextureLoader().load(url, (texture) => {
                texture.colorSpace = THREE.SRGBColorSpace;
                const imageAspect = texture.image.width / texture.image.height;
                cube.geometry.dispose();
                if (imageAspect > 1) cube.geometry = new THREE.PlaneGeometry(3, 3 / imageAspect);
                else cube.geometry = new THREE.PlaneGeometry(3 * imageAspect, 3);
                cube.material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
                cube.material.needsUpdate = true;
                document.getElementById('cameraControl').classList.remove('hidden');
                setTimeout(() => { const w = container.clientWidth; const h = container.clientHeight; camera.aspect = w / h; camera.updateProjectionMatrix(); renderer.setSize(w, h); }, 100);
            });
        };
    </script>

    <script>
        if(window.lucide) lucide.createIcons();
        function generateUUID() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) { try { return crypto.randomUUID(); } catch (e) {} }
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = Math.random()*16|0, v = c=='x'?r:(r&0x3|0x8); return v.toString(16); });
        }
        const CLIENT_ID = localStorage.getItem("client_id") || generateUUID();
        localStorage.setItem("client_id", CLIENT_ID);

        let currentEngine = 'local';
        const ENGINE_MODE_KEY = 'angle_engine_mode';
        let uploadedPath = "";
        let uploadedFile = null;
        let currentResult = null;
        let allHistory = [];
        let currentIndex = 0;
        const PAGE_SIZE = 30;

        window.switchEngine = function(mode) {
            currentEngine = mode;
            localStorage.setItem(ENGINE_MODE_KEY, mode);
            const glider = document.getElementById('glider');
            const localBtn = document.getElementById('modeLocal');
            const cloudBtn = document.getElementById('modeCloud');
            if (mode === 'local') { glider.style.transform = 'translateX(0)'; localBtn.classList.add('active'); cloudBtn.classList.remove('active'); }
            else { glider.style.transform = 'translateX(100%)'; cloudBtn.classList.add('active'); localBtn.classList.remove('active'); }
        };

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');
        const promptInput = document.getElementById('promptInput');
        dropzone.onclick = () => fileInput.click();
        fileInput.onchange = (e) => handleFile(e.target.files[0]);
        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('border-black','bg-gray-50'); });
        dropzone.addEventListener('dragleave', () => { dropzone.classList.remove('border-black','bg-gray-50'); });
        dropzone.addEventListener('drop', (e) => { e.preventDefault(); dropzone.classList.remove('border-black','bg-gray-50'); if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
        let isHovering = false;
        dropzone.addEventListener('mouseenter', () => isHovering = true);
        dropzone.addEventListener('mouseleave', () => isHovering = false);
        window.addEventListener('paste', (e) => {
            if (!isHovering) return;
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) { if (item.kind === 'file' && item.type.startsWith('image/')) { handleFile(item.getAsFile()); break; } }
        });

        async function handleFile(file) {
            if (!file) return;
            uploadedFile = file;
            const btn = document.getElementById('genBtn');
            const btnText = document.getElementById('btnText');
            btn.disabled = true;
            btnText.innerText = StudioI18n.t('angle.uploading');
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                previewImg.classList.remove('hidden');
                document.getElementById('uploadContent').classList.add('opacity-0');
                document.getElementById('changeOverlay').classList.replace('hidden','flex');
                if (window.update3DTexture) window.update3DTexture(e.target.result);
            };
            reader.readAsDataURL(file);
            const formData = new FormData();
            formData.append('files', file);
            try {
                const res = await fetch('/api/comfy/upload', { method:'POST', body:formData });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || StudioI18n.t('angle.uploadFailed'));
                uploadedPath = data.files[0].comfy_name;
                btn.disabled = false;
                btnText.innerText = StudioI18n.t('angle.generateAngle');
            } catch (err) {
                console.error('上传失败', err);
                btnText.innerText = StudioI18n.t('angle.uploadFailed');
                btn.disabled = false;
            }
        }

        async function runCloudTask() {
            if (!uploadedFile) throw new Error(StudioI18n.t('angle.uploadRequired'));
            const toBase64 = file => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
            const dataUri = await toBase64(uploadedFile);
            const payload = { "prompt": promptInput.value, "type": "angle", "model": "Qwen/Qwen-Image-Edit-2511", "image_urls": [dataUri], "client_id": CLIENT_ID };
            document.getElementById('cloud-progress-container').classList.remove('hidden');
            document.getElementById('cloud-progress-bar').style.width = '100%';
            document.getElementById('cloud-percent').innerText = StudioI18n.t('angle.processing');
            const response = await fetch('/api/angle/generate', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || StudioI18n.t('angle.cloudGenerateFailed'));
            if (data.url) return { images: [data.url] };
            throw new Error(StudioI18n.t('angle.noImageReturned'));
        }

        async function handleGenerate() {
            if (!uploadedPath && currentEngine === 'local') {
                dropzone.style.transition = "0.2s"; dropzone.style.borderColor = "#ef4444"; dropzone.style.transform = "scale(0.98)";
                setTimeout(() => { dropzone.style.borderColor = ""; dropzone.style.transform = "scale(1)"; }, 300);
                return;
            }
            if (!uploadedFile && currentEngine === 'cloud') { alert(StudioI18n.t('angle.uploadRequired')); return; }
            if (!promptInput.value.trim()) { promptInput.style.borderColor = "#ef4444"; setTimeout(() => promptInput.style.borderColor = "", 300); return; }
            const btn = document.getElementById('genBtn');
            const btnText = document.getElementById('btnText');
            btn.disabled = true;
            btn.style.backgroundColor = '#333';
            btn.innerHTML = `<i data-lucide="zap" class="w-4 h-4 text-yellow-400 fill-yellow-400 animate-pulse"></i><span class="tracking-[0.4em] text-[11px] uppercase">${StudioI18n.t('angle.processing')}</span>`;
            if(window.lucide) lucide.createIcons();
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('outputImg').classList.add('hidden');
            document.getElementById('loadingState').classList.remove('hidden');
            try {
                let data;
                if (currentEngine === 'cloud') { data = await runCloudTask(); }
                else {
                    const seed = Math.floor(Math.random() * 1000000000000000);
                    const res = await fetch('/api/generate', {
                        method:'POST', headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({ workflow_json: "2511.json", params: { "31": { "image": uploadedPath }, "11": { "prompt": promptInput.value }, "14": { "seed": seed } }, type: "angle", client_id: CLIENT_ID })
                    });
                    data = await res.json();
                    if (!res.ok) throw new Error(data.detail || StudioI18n.t('angle.generateFailed'));
                    if (!data.images?.length) throw new Error(StudioI18n.t('angle.noImageReturned'));
                }
                currentResult = data;
                const outputImg = document.getElementById('outputImg');
                const downloadBtn = document.getElementById('downloadBtn');
                outputImg.src = data.images[0];
                outputImg.classList.remove('hidden');
                document.getElementById('loadingState').classList.add('hidden');
                downloadBtn.href = data.images[0];
                downloadBtn.classList.remove('hidden');
                downloadBtn.download = `Angle-${Date.now()}.png`;
                btn.style.backgroundColor = '';
                btn.innerHTML = `<i data-lucide="zap" class="w-4 h-4 text-yellow-400"></i><span id="btnText">${StudioI18n.t('angle.generateAngle')}</span>`;
                btn.disabled = false;
                if(window.lucide) lucide.createIcons();
                renderImageCard({ id: data.id, images: data.images, prompt: promptInput.value, timestamp: Date.now(), is_cloud: (currentEngine === 'cloud') }, true);
            } catch (err) {
                console.error(err);
                btn.style.backgroundColor = '';
                btn.innerHTML = `<i data-lucide="zap" class="w-4 h-4 text-yellow-400"></i><span id="btnText">${StudioI18n.t('angle.generateFailed')}</span>`;
                if(window.lucide) lucide.createIcons();
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
                btn.disabled = false;
                alert(err.message);
            }
        }

        function renderImageCard(data, isNew = false) {
            const imgUrl = data.images?.[0] || data.outputUrl;
            if (!imgUrl) return;
            const ts = data.id || data.timestamp || data.createdAt || Date.now();
            const masonry = document.getElementById('masonry');
            if (document.getElementById(`h-${ts}`)) return;
            const card = document.createElement('div');
            card.id = `h-${ts}`;
            card.dataset.historyTs = String(ts);
            card.className = "masonry-item relative group cursor-pointer";
            card.onclick = () => { if(document.body.classList.contains('history-bulk-selecting')) return; openLightbox(imgUrl); };
            const isCloud = data.is_cloud || (imgUrl && imgUrl.includes('cloud_angle'));
            const badgeHtml = isCloud ? `<div class="absolute top-3 left-3 z-10"><span class="bg-white/90 rounded-full px-2 py-0.5 text-[8px] font-bold">ModelScope</span></div>` : '';
            card.innerHTML = `<img src="${imgUrl}" class="w-full h-full object-cover block transform group-hover:scale-105 transition-transform duration-[1.5s]">${badgeHtml}<div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-all duration-300 p-6 flex flex-col justify-end pointer-events-none"><p class="text-white text-[10px] font-bold uppercase tracking-widest line-clamp-2">${(data.prompt || StudioI18n.t('angle.title')).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}</p></div>`;
            if (isNew) masonry.prepend(card); else masonry.appendChild(card);
        }

        function loadNextPage() {
            const batch = allHistory.slice(currentIndex, currentIndex + PAGE_SIZE);
            if (batch.length === 0) { const el = document.getElementById('loadMoreTrigger'); if (el) el.innerText = StudioI18n.t('angle.archiveEnd'); return; }
            batch.forEach(item => renderImageCard(item, false));
            currentIndex += PAGE_SIZE;
        }

        async function loadHistory() {
            try {
                const res = await fetch('/api/canvas/image-history');
                const data = await res.json();
                if (data.history && Array.isArray(data.history)) {
                    allHistory = data.history;
                    document.getElementById('masonry').innerHTML = '';
                    currentIndex = 0;
                    loadNextPage();
                }
            } catch (e) { console.error(e); }
        }

        function openLightbox(url) {
            const frame = document.getElementById('lightboxFrame');
            const img = document.getElementById('lightboxImg');
            const resPill = document.getElementById('lightboxRes');
            resPill.style.opacity = '0';
            img.src = url;
            document.getElementById('lightbox').classList.replace('hidden','flex');
            frame.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            const updateRes = () => { if (img.naturalWidth) { resPill.innerText = `${img.naturalWidth} x ${img.naturalHeight}`; resPill.style.opacity = '1'; } };
            img.onload = updateRes;
            if (img.complete) updateRes();
        }
        function closeLightbox() { document.getElementById('lightbox').classList.replace('flex','hidden'); document.body.style.overflow = 'auto'; }
        function handleOutsideClick(e) { if (e.target.id === 'lightbox') closeLightbox(); }
        function downloadLightboxImage() {
            const imgUrl = document.getElementById('lightboxImg').src;
            const link = document.createElement('a'); link.href = imgUrl; link.download = `Angle-Master-${Date.now()}.png`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }
        function zoomImage() { if (currentResult && currentResult.images && currentResult.images[0]) openLightbox(currentResult.images[0]); }

        const observer = new IntersectionObserver((entries) => { if (entries[0].isIntersecting && allHistory.length > 0) loadNextPage(); }, { threshold: 0.1 });

        window.onload = () => {
            const savedMode = localStorage.getItem(ENGINE_MODE_KEY);
            if (savedMode && (savedMode === 'local' || savedMode === 'cloud')) switchEngine(savedMode);
            loadHistory();
            window.HistoryBulkManager?.attach({container:'#masonry'});
            observer.observe(document.getElementById('loadMoreTrigger'));
        };
    </script>
