<!DOCTYPE html>
<html lang="zh-CN" data-studio-scale="off">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="canvas.projectWorkspace">项目工作台</title>
  <script>
    (function(){
      try {
        var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'light';
        if (theme === 'dark') document.documentElement.classList.add('theme-dark', 'studio-theme-dark');
      } catch (e) {}
    })();
  </script>
  <script src="brand-config.js"></script>
  <script src="/smart-canvas-core/vendor/js/lucide.js"></script>
  <script src="/smart-canvas-core/theme.js"></script>
  <script src="/smart-canvas-core/touch-mouse.js"></script>
  <script src="/smart-canvas-core/i18n.js"></script>
  <link rel="stylesheet" href="/smart-canvas-core/vendor/css/fonts.css">
  <link rel="stylesheet" href="/canvas-list.css?v=2026.08.13.1">
  <link rel="stylesheet" href="/lanvas-unified.css?v=2026.08.21.1">
</head>
<body>
  <div id="studioSidebarHost"></div>
  <div id="workspace" class="workspace">
    <aside id="sidebar" class="ws-sidebar">
      <div class="ws-side-head"><div class="ws-side-title" data-i18n="canvas.projects">项目</div><button id="newProjectBtn" class="ws-side-add" type="button" title="新建项目" aria-label="新建项目" data-i18n-title="canvas.newProject"><i data-lucide="plus" class="w-4 h-4"></i></button></div>
      <div id="newProjectRow" class="ws-newproj-row"><input id="newProjectInput" class="ws-newproj-input" type="text" maxlength="60" placeholder="项目名称" data-i18n-placeholder="canvas.projectName"><button id="newProjectConfirm" class="ws-mini-btn primary" type="button" title="确定" aria-label="确定" data-i18n-title="canvas.confirm"><i data-lucide="check" class="w-3.5 h-3.5"></i></button><button id="newProjectCancel" class="ws-mini-btn" type="button" title="取消" aria-label="取消" data-i18n-title="canvas.cancel"><i data-lucide="x" class="w-3.5 h-3.5"></i></button></div>
      <div id="projectList" class="ws-project-list"></div>
      <div class="ws-side-foot"><button id="trashEntry" class="ws-trash-entry" type="button"><i data-lucide="trash-2" class="w-4 h-4"></i><span class="ws-trash-label" data-i18n="canvas.trash">回收站</span><span id="trashBadge" class="ws-trash-badge">0</span></button></div>
    </aside>
    <main class="ws-main">
      <div class="ws-topbar"><div class="ws-topbar-left"><div id="boardProjectName" class="ws-board-name" data-i18n="canvas.defaultProject">默认项目</div><span id="boardCanvasCount" class="ws-board-count">0</span></div><div class="ws-topbar-right"><button id="pasteCanvasBtn" class="ws-paste-btn" type="button" title="粘贴到此项目" data-i18n-title="canvas.pasteToProject" style="display:none"><i data-lucide="clipboard-paste" class="w-4 h-4"></i><span data-i18n="canvas.pasteToProject">粘贴到此项目</span></button><button id="boardResetView" class="ws-icon-btn" type="button" title="重置视图" aria-label="重置视图" data-i18n-title="canvas.resetView"><i data-lucide="locate-fixed" class="w-4 h-4"></i></button><button id="boardRefresh" class="ws-icon-btn" type="button" title="刷新" aria-label="刷新" data-i18n-title="canvas.refresh"><i data-lucide="refresh-cw" class="w-4 h-4"></i></button><button id="newCanvasBtn" class="ws-primary-btn" type="button"><i data-lucide="plus" class="w-4 h-4"></i><span data-i18n="canvas.newCanvas">新建画布</span></button></div></div>
      <div id="board" class="ws-board"><div id="boardWorld" class="ws-board-world"></div><div id="boardEmptyHint" class="ws-board-empty"><div class="ws-board-empty-icon"><i data-lucide="mouse-pointer-click" class="w-7 h-7"></i></div><div class="ws-board-empty-text" data-i18n="canvas.noCanvas">暂无画布</div><div class="ws-board-empty-sub" data-i18n="canvas.createFirstCanvas">为当前项目创建第一块画布</div><div class="ws-board-empty-actions"><button id="emptyCreateCanvasBtn" class="ws-primary-btn" type="button"><i data-lucide="plus" class="w-4 h-4"></i><span data-i18n="canvas.newCanvas">新建画布</span></button></div></div></div>
      <div id="trashPanel" class="ws-trash-panel"><div class="ws-trash-head"><div class="ws-trash-head-title"><i data-lucide="trash-2" class="w-4 h-4"></i><span data-i18n="canvas.trash">回收站</span></div><button id="trashClose" class="ws-icon-btn" type="button" title="关闭" aria-label="关闭" data-i18n-title="canvas.close"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="ws-trash-note"><i data-lucide="info" class="w-3.5 h-3.5"></i><span data-i18n="canvas.trashNote">回收站中的画布会在 30 天后自动清理。</span></div><div id="trashList" class="ws-trash-list"></div></div>
      <div id="boardStatus" class="ws-status"></div>
    </main>
  </div>
  <script src="/canvas-list.js?v=2026.08.13.3"></script>
<script src="/external-link.js"></script>
  <script src="/lanvas-unified.js?v=2026.08.21.1"></script>
</body>
</html>
